name: moon_design
description: Moon Design System for Flutter. A set of coherent, themable, and extensible widgets following the Moon Design System.
version: 1.1.0
homepage: https://flutter.moon.io/
repository: https://github.com/coingaming/moon_flutter
publish_to: none

environment:
  sdk: ">=3.3.1 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  moon_tokens:
    git:
      url: git@github.com:komiljonovshohjahon/moon-tokens.git
      path: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  lint: ^2.1.2

flutter:
  uses-material-design: true
